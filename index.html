<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AFOHAS — Compras e finanças</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="app-css">body{margin:0;font:16px system-ui,sans-serif;background:#eef4ef;color:#14231b}.boot{padding:32px;text-align:center}</style>
</head><body>
<div id="app"><p class="boot">Carregando…</p></div>
<noscript>Este sistema precisa de JavaScript.</noscript>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Carregador fixo: busca a versão ativa do app no Supabase e a executa. Não precisa ser atualizado.
(async()=>{
  const U='https://auhulhpueqbcmixikjcw.supabase.co',K='sb_publishable_SHig-x23rE2qpsXeDNzl4g_77PxDTXa',box=document.getElementById('app');
  const falha=m=>{box.innerHTML='';const p=document.createElement('p');p.className='boot';p.textContent=m;const b=document.createElement('button');b.textContent='Tentar novamente';b.onclick=()=>location.reload();box.append(p,b)};
  try{
    const r=await fetch(U+'/rest/v1/app_bundle?select=version,css,code&ativo=eq.true&limit=1',{headers:{apikey:K,'Accept-Profile':'compras'},cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();if(!d.length||!d[0].code)throw new Error('nenhuma versão ativa');
    document.getElementById('app-css').textContent=d[0].css||'';
    const s=document.createElement('script');s.textContent=d[0].code;document.body.append(s);
  }catch(e){falha('Não foi possível carregar o sistema ('+(e.message||e)+'). Verifique a internet.')}
})();
</script></body></html>
